<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - INFINA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: white; padding: 30px; }
        h1 { color: #9d4edd; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* Tablar (Bo'limlar) */
        .tabs { display:flex; gap:10px; margin-bottom:30px; }
        .tab-btn { padding:10px 20px; background:#222; border:1px solid #333; color:white; cursor:pointer; border-radius:5px; font-weight:bold; }
        .tab-btn.active { background:#9d4edd; border-color:#9d4edd; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Ariza Kartochkalari */
        .app-card { background:#222; border:1px solid #333; padding:20px; margin-bottom:15px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; }
        .app-info h3 { margin:0 0 5px 0; color:#fff; }
        .app-info p { margin:2px 0; color:#aaa; font-size:14px; }
        .status-badge { padding:5px 10px; border-radius:5px; font-size:12px; font-weight:bold; }
        .pending { background:#f39c12; color:black; }
        .accepted { background:#2ecc71; color:white; }
        .rejected { background:#e74c3c; color:white; }
        .btn-group button { padding:10px 15px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; margin-left:10px; color:white; }
        .btn-accept { background:#2ecc71; } .btn-accept:hover { background:#27ae60; }
        .btn-reject { background:#e74c3c; } .btn-reject:hover { background:#c0392b; }

        /* Post Qo'shish Formasi */
        .post-form { background:#222; padding:20px; border-radius:10px; margin-bottom:30px; border:1px solid #333; max-width:600px; }
        .post-form input, .post-form textarea { width:100%; padding:10px; margin-bottom:10px; background:#111; border:1px solid #444; color:white; border-radius:5px; box-sizing:border-box; }
        .post-form button { padding:10px 20px; background:#9d4edd; border:none; color:white; border-radius:5px; cursor:pointer; font-weight:bold; width:100%; }
        
        /* Postlar Ro'yxati */
        .post-item { background:#222; border:1px solid #333; padding:15px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; }
        .post-item img { width:80px; height:60px; object-fit:cover; border-radius:5px; margin-right:15px; }
        .post-item-content { display:flex; align-items:center; }
        .btn-del { background:#e74c3c; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>
    <h1>INFINA Admin Panel</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('apps')">Arizalar</button>
        <button class="tab-btn" onclick="openTab('posts')">Postlar (Ishlar)</button>
    </div>

    <!-- ARIZALAR BO'LIMI -->
    <div id="apps" class="tab-content active">
        <div id="appList"><p>Yuklanmoqda...</p></div>
    </div>

    <!-- POSTLAR BO'LIMI -->
    <div id="posts" class="tab-content">
        <div class="post-form">
            <h3>Yangi Post (Loyiha) Qo'shish</h3>
            <input type="text" id="postTitle" placeholder="Sarlavha (masalan: Yangi mobil ilova)">
            <input type="text" id="postImage" placeholder="Rasm URL manzili (ixtiyoriy)">
            <textarea id="postDesc" rows="4" placeholder="Loyiha haqida qisqacha ma'lumot..."></textarea>
            <button onclick="addPost()">Postni Saqlash</button>
        </div>
        <h3>Mavjud Postlar</h3>
        <div id="postList"><p>Yuklanmoqda...</p></div>
    </div>

    <script>
        // Tablarni almashtirish
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            
            if (tabId === 'apps') loadApps();
            if (tabId === 'posts') loadPosts();
        }

        // --- ARIZALAR MANTIG'I ---
        async function loadApps() {
            const res = await fetch('/api/applications');
            const apps = await res.json();
            const list = document.getElementById('appList');
            list.innerHTML = apps.length === 0 ? '<p>Arizalar yo\'q.</p>' : '';

            apps.forEach(app => {
                let badgeClass = app.status === 'pending' ? 'pending' : (app.status === 'accepted' ? 'accepted' : 'rejected');
                let badgeText = app.status === 'pending' ? 'Kutilmoqda' : (app.status === 'accepted' ? 'Qabul qilindi' : 'Rad etildi');
                let buttons = app.status === 'pending' 
                    ? `<button class="btn-accept" onclick="action(${app.id}, 'accepted')">Qabul qilish</button>
                       <button class="btn-reject" onclick="action(${app.id}, 'rejected')">Rad etish</button>` 
                    : '';

                list.innerHTML += `
                    <div class="app-card">
                        <div class="app-info">
                            <h3>${app.name} <span class="status-badge ${badgeClass}">${badgeText}</span></h3>
                            <p><b>Yo'nalish:</b> ${app.direction}</p>
                            <p><b>Tel:</b> ${app.phone} | <b>TG:</b> @${app.telegram}</p>
                            <p><b>Tajriba:</b> ${app.experience}</p>
                        </div>
                        <div class="btn-group">${buttons}</div>
                    </div>
                `;
            });
        }

        async function action(id, type) {
            if (!confirm("Tasdiqlaysizmi?")) return;
            const res = await fetch(`/api/application/${id}/${type}`, { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            loadApps();
        }

        // --- POSTLAR MANTIG'I ---
        async function loadPosts() {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const list = document.getElementById('postList');
            list.innerHTML = posts.length === 0 ? '<p>Postlar yo\'q.</p>' : '';

            posts.forEach(post => {
                list.innerHTML += `
                    <div class="post-item">
                        <div class="post-item-content">
                            ${post.image_url ? `<img src="${post.image_url}">` : ''}
                            <div>
                                <strong>${post.title}</strong><br>
                                <small style="color:#aaa;">${post.description.substring(0, 50)}...</small>
                            </div>
                        </div>
                        <button class="btn-del" onclick="deletePost(${post.id})">O'chirish</button>
                    </div>
                `;
            });
        }

        async function addPost() {
            const title = document.getElementById('postTitle').value;
            const image_url = document.getElementById('postImage').value;
            const description = document.getElementById('postDesc').value;

            if (!title || !description) return alert("Sarlavha va matnni kiriting!");

            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, image_url })
            });
            
            if (res.ok) {
                alert("Post qo'shildi!");
                document.getElementById('postTitle').value = '';
                document.getElementById('postImage').value = '';
                document.getElementById('postDesc').value = '';
                loadPosts();
            }
        }

        async function deletePost(id) {
            if (!confirm("Rostdan ham o'chirmoqchimisiz?")) return;
            await fetch(`/api/posts/${id}`, { method: 'DELETE' });
            loadPosts();
        }

        // Boshlang'ich yuklash
        loadApps();
    </script>
</body>
</html>
